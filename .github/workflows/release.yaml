name: Release Image and Helm Chart

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build:
    name: Build & Push
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Package the v2 chart for this tag
        run: |
          helm package charts/npd-node-replace-v2 \
            --version "${GITHUB_REF_NAME#v}" \
            --app-version "$GITHUB_REF_NAME" \
            --destination "$RUNNER_TEMP/chart"

      - name: Save packaged chart for publication
        uses: actions/upload-artifact@v4
        with:
          name: release-chart
          path: ${{ runner.temp }}/chart/*.tgz
          if-no-files-found: error
          overwrite: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          provenance: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-chart:
    name: Publish Helm chart
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-chart
          path: .cr-release-packages

      - name: Install chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          install_only: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish chart and update the Helm repository index
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          repo=(--owner "$GITHUB_REPOSITORY_OWNER" --git-repo "${GITHUB_REPOSITORY#*/}")
          cr upload "${repo[@]}" --commit "$(git rev-parse HEAD)" --skip-existing
          mkdir -p .cr-index
          cr index "${repo[@]}" --push
